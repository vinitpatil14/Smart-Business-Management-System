<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexpulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nexpulse-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#nexpulse-grad)" filter="url(#shadow)"/>

  <!-- Subtle inner border -->
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Monogram 'N' + Pulse Wave Vector -->
  <!-- Left stem of N -->
  <path d="M19 45V19" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Diagonal connection infused with a dynamic pulse wave: (19,19) -> (27,33) -> (31,24) -> (36,41) -> (45,19) -->
  <path d="M19 19L27 34L32 23L37 40L45 19" stroke="url(#nexpulse-glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right stem of N -->
  <path d="M45 19V45" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Real-time telemetry spark indicator dot -->
  <circle cx="32" cy="23" r="3.25" fill="#38bdf8" stroke="white" stroke-width="1.5"/>
</svg>
